services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    shm_size: '2gb'
    volumes:
      - .:/workspace
    environment:
      - HF_HOME=/workspace/.hf_cache
      - EMBEDDING_SERVER_URL=http://embed-server:8765
      - INDEX_SERVER_URL=http://index-server:8766
    working_dir: /workspace

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__MAX_REQUEST_SIZE_MB=256
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':>/dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  embed-server:
    build:
      context: .
      dockerfile: 6-embed/docker/Dockerfile
    ports:
      - "8765:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  index-server:
    build:
      context: .
      dockerfile: 7-index/docker/Dockerfile
    ports:
      - "8766:8766"
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8766/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  ollama_models:
  qdrant_storage:
